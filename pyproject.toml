[project]
name = "noc-noc"
version = "0.1.0"
description = "Find your NOC 2021 occupation code."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "scikit-learn>=1.6",
]

[project.scripts]
noc-noc = "noc_noc.cli:main"

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "pytest-cov>=7.0", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.mypy]
strict = true
packages = ["noc_noc"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]  # scikit-learn ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=noc_noc --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error"]
